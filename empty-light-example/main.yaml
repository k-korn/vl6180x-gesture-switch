esphome:
  name: sw
  friendly_name: sw
  name_add_mac_suffix: true

preferences:
  flash_write_interval: 5min

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

# Enable logging
logger:
  logs:
    sensor: WARN
    dallas.temp.sensor: WARN
    #vl53l0x: WARN
    ld2410s: WARN
      
external_components:
  - source:
      type: local
      path: components


