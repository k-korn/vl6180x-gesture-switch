ota:
  platform: esphome
  password: ""

wifi:
  ssid: "-"
  password: "-"
  fast_connect: true
  use_address: esp-sensor-test.lan

mdns:
  disabled: true

i2c:
debug:
  update_interval: 5s
  
      
      
sensor:

# Debug sensors
  - platform: debug
    loop_time:
      name: "Loop Time"

     
      
output:
